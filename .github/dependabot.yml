# Dependency updates (audit 2, S11). Python runtime pins live in requirements/ (runtime.lock is generated from
# image.in: regenerate it when merging a runtime.txt bump; see the command in requirements/image.in).
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm          # the Console (pnpm-lock.yaml)
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      console-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker       # base images of infra/Dockerfile.*
    directory: /infra
    schedule:
      interval: weekly
