name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check (gateway, worker, SDK)
        run: mypy --ignore-missing-imports --no-strict-optional --python-version 3.11 gateway worker sdk/src/lorde
      - name: Dependency audit (the runtime image's pinned, hashed lock file)
        run: pip-audit -r requirements/runtime.lock --require-hashes --disable-pip --progress-spinner off
      - name: Shell syntax
        run: bash -n forge/00_serve.sh && sh -n infra/start-api.sh
      - name: Tests (contract, parser fuzzing, metrics, pipeline, gateway, SDK, Supabase SQL, worker)
        env:
          LITELLM_LOG: ERROR
          LORDE_TEST_PG_URL: postgresql://postgres@localhost:5432/postgres
          LORDE_TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest -q

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:live   # production build against a fake Supabase: auth redirects, session-gated APIs
