name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Shell syntax
        run: bash -n forge/00_serve.sh
      - name: Tests (contract, parser fuzzing, metrics, end-to-end pipeline on stub servers)
        env:
          LITELLM_LOG: ERROR
        run: pytest -q
