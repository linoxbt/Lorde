[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lorde"
version = "0.1.0"
description = "Python SDK, CLI and MCP server for Lorde, the 3B judge for CuratorKIT's quality gates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
lorde = "lorde.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
